[project]
name = "circuit-steering"
version = "0.1.0"
description = "Controlled test of circuit-targeted steering, LoRA and editing on Tiny Aya, with a Nothing-Else-Broke audit"
readme = "README.md"
authors = [{ name = "Md.Sadiq", email = "mohammadsadiq4950@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aya-circuits",
    "nothing-else-broke",
    "auditkit>=1.1.3",
    "circuitkit==0.2.0",
    "peft>=0.21.2",
    "safetune>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
aya-circuits = { path = "../tiny-aya-circuits", editable = true }
nothing-else-broke = { path = "../nothing-else-broke", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "NPY", "C4", "PIE", "FURB", "PLE", "T10", "RUF"]
# en dashes, ×, − and Greek letters in strings and docstrings are intended
ignore = ["RUF001", "RUF002", "RUF003"]
